 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Generate 200 stylish Instagram captions in every category. Find captions for boys, girls, love, attitude, friendship and more.">
  <meta name="theme-color" content="#10101c">
  <title>Instagram Captions Generator - Insta Vibez</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .caption-section {
      max-width: 1100px;
      margin: 45px auto;
      padding: 25px 18px;
      text-align: center;
      min-height: 450px;
    }

    .caption-section h1 {
      margin-bottom: 12px;
    }

    .caption-categories {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 28px 0;
    }

    .caption-categories button {
      padding: 11px 18px;
      border: 1px solid var(--border, #333);
      border-radius: 25px;
      background: var(--card, #191929);
      color: inherit;
      cursor: pointer;
      font-size: 15px;
    }

    .caption-categories button.active {
      background: #8b5cf6;
      color: white;
      border-color: #8b5cf6;
    }

    #captionSearch {
      width: 100%;
      max-width: 550px;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border, #444);
      background: #10101c;
      color: white;
      margin: 10px auto 28px;
      font-size: 15px;
    }

    .caption-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      text-align: left;
    }

    .caption-card {
      background: var(--card, #191929);
      border: 1px solid var(--border, #333);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 15px;
    }

    .caption-card p {
      line-height: 1.7;
      margin: 0;
      overflow-wrap: anywhere;
    }

    .caption-copy {
      padding: 10px 17px;
      border: none;
      border-radius: 7px;
      background: #8b5cf6;
      color: white;
      cursor: pointer;
      align-self: flex-start;
      font-size: 14px;
    }

    .caption-copy.copied {
      background: #16a34a;
    }

    #captionLoadMore {
      display: none;
      margin: 28px auto;
      padding: 13px 28px;
      background: #8b5cf6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    #captionCount {
      margin: 8px 0 20px;
      opacity: 0.8;
    }

    @media(max-width: 600px) {
      .caption-section {
        padding: 20px 12px;
      }

      .caption-categories button {
        padding: 9px 13px;
        font-size: 13px;
      }

      .caption-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="container nav">
    <a href="index.html" class="logo">Insta<span>Vibez</span></a>

    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
      ☰
    </button>

    <nav class="navbar" id="navbar">
      <a href="index.html">Home</a>
      <a href="bio.html">Bio</a>
      <a href="username.html">Username</a>
      <a href="fonts.html">Fonts</a>
      <a href="guide.html">Guide</a>
    </nav>
  </div>
</header>

<main>
  <section class="caption-section">

    <h1>Instagram Captions Generator 📸</h1>
    <p>Find the perfect caption for every Instagram post!</p>

    <div class="caption-categories" id="captionCategories">
      <button class="active" data-category="all">All</button>
      <button data-category="attitude">Attitude</button>
      <button data-category="boys">Boys</button>
      <button data-category="girls">Girls</button>
      <button data-category="love">Love</button>
      <button data-category="sad">Sad</button>
      <button data-category="friendship">Friendship</button>
      <button data-category="selfie">Selfie</button>
      <button data-category="travel">Travel</button>
      <button data-category="motivational">Motivational</button>
    </div>

    <input
      type="search"
      id="captionSearch"
      placeholder="Search your favourite captions..."
    >

    <p id="captionCount">Loading captions...</p>

    <div class="caption-list" id="captionList"></div>

    <button id="captionLoadMore">Load More</button>

  </section>
</main>

<footer class="footer">
  <div class="container">
    <a href="index.html" class="logo">Insta<span>Vibez</span></a>

    <p>Make Your Profile Unique ✨</p>

    <div class="footer-links">
      <a href="privacy.html">Privacy Policy</a>
      <a href="guide.html">Guide</a>
    </div>

    <p>
      © <span id="currentYear">2026</span>
      Insta Vibez. All Rights Reserved.
    </p>
  </div>
</footer>

<script src="common.js" defer></script>
<script src="script.js" defer></script>

<script>
(() => {
  "use strict";

  const baseCaptions = {
    attitude: [
      "My attitude is my identity. 😎",
      "I don't follow trends, I create them.",
      "Born to stand out, not to fit in.",
      "Silent moves, loud results.",
      "My vibe speaks louder than words.",
      "Not perfect, just original.",
      "Confidence is my favourite outfit.",
      "I know my worth, no discount.",
      "Less talk, more action.",
      "Different mindset, different level."
    ],

    boys: [
      "A simple boy with big dreams.",
      "Creating my own journey. ✨",
      "King of my own world.",
      "Dream big, stay humble.",
      "No shortcuts, only hard work.",
      "Just a boy chasing happiness.",
      "Stay real, stay original.",
      "One life, endless possibilities.",
      "Making memories every day.",
      "Focused on my goals."
    ],

    girls: [
      "Confidence looks beautiful on me. 💖",
      "A little sparkle everywhere I go.",
      "Happiness is my favourite filter.",
      "Beautiful mind, beautiful soul.",
      "Smiling through every season.",
      "Own your magic.",
      "Just being my lovely self.",
      "Sunshine mixed with a little magic.",
      "Elegance never goes out of style.",
      "Blooming at my own pace."
    ],

    love: [
      "You make ordinary moments special. ❤️",
      "Love is felt, not explained.",
      "Every love story is beautiful.",
      "You are my favourite notification.",
      "Together is my favourite place.",
      "A little love goes a long way.",
      "My heart found its home.",
      "Love makes life beautiful.",
      "Forever starts with a moment.",
      "You are my happy place."
    ],

    sad: [
      "Some feelings have no words.",
      "Smiling outside, healing inside.",
      "Not every silence means peace.",
      "Some memories never fade.",
      "Behind every smile, a story exists.",
      "Sometimes distance says everything.",
      "Healing takes time.",
      "Quiet hearts feel deeply.",
      "Some goodbyes stay forever.",
      "Learning to let go."
    ],

    friendship: [
      "Friends make life unforgettable. 🫶",
      "Real friends, endless memories.",
      "Together is always better.",
      "Partners in every adventure.",
      "Friendship is a beautiful journey.",
      "Crazy moments, priceless memories.",
      "Good friends are rare treasures.",
      "Side by side, heart to heart.",
      "Life is better with friends.",
      "Forever my favourite people."
    ],

    selfie: [
      "Just me, being me. 📸",
      "A moment worth remembering.",
      "Smile more, worry less.",
      "Confidence in every click.",
      "No filter, just vibes.",
      "Today's mood: Happy.",
      "A little selfie, a lot of confidence.",
      "Collecting moments, not likes.",
      "Feeling good, looking better.",
      "Simply unforgettable."
    ],

    travel: [
      "Collect memories, not things. 🌍",
      "Wander often, wonder always.",
      "New places, fresh beginnings.",
      "Adventure is calling.",
      "Lost in the right direction.",
      "Travel far, feel free.",
      "The world is full of wonders.",
      "Every journey tells a story.",
      "Chasing sunsets and dreams.",
      "Life is a beautiful journey."
    ],

    motivational: [
      "Dream it. Believe it. Achieve it.",
      "Small steps lead to big results.",
      "Your only limit is you.",
      "Work hard, stay consistent.",
      "Never stop believing in yourself.",
      "Progress over perfection.",
      "Make today count.",
      "Success starts with courage.",
      "Keep going, keep growing.",
      "Your future is created today."
    ]
  };

  const endings = [
    "And that's my story.",
    "Living every moment.",
    "Making it count.",
    "Keeping it real.",
    "One day at a time.",
    "With my own style.",
    "Nothing can change that.",
    "Always moving forward.",
    "This is just the beginning.",
    "And loving every second.",
    "No regrets, just lessons.",
    "That's the way I live.",
    "With a grateful heart.",
    "Creating beautiful memories.",
    "Staying true to myself.",
    "My journey, my rules.",
    "Let the moments shine.",
    "A little more every day.",
    "Keeping the good vibes.",
    "And that's what matters."
  ];

  const captions = {};

  // Create exactly 200 captions in every category
  Object.keys(baseCaptions).forEach(category => {
    captions[category] = [];

    baseCaptions[category].forEach(base => {
      endings.forEach(ending => {
        captions[category].push(base + " " + ending);
      });
    });
  });

  const list = document.getElementById("captionList");
  const search = document.getElementById("captionSearch");
  const loadMore = document.getElementById("captionLoadMore");
  const countText = document.getElementById("captionCount");
  const categoryButtons = document.querySelectorAll(
    "#captionCategories button"
  );

  if (!list || !search || !loadMore || !countText || !categoryButtons.length) {
    console.error("Caption Generator HTML elements are missing.");
    return;
  }

  let currentCategory = "all";
  let visibleCount = 20;

  function getResults() {
    let results = [];

    Object.keys(captions).forEach(category => {
      if (currentCategory === "all" || currentCategory === category) {
        captions[category].forEach(caption => {
          results.push(caption);
        });
      }
    });

    const query = search.value.trim().toLowerCase();

    if (query) {
      results = results.filter(caption =>
        caption.toLowerCase().includes(query)
      );
    }

    return results;
  }

  function renderCaptions() {
    const results = getResults();

    list.innerHTML = "";

    results.slice(0, visibleCount).forEach(caption => {
      const card = document.createElement("div");
      card.className = "caption-card";

      const paragraph = document.createElement("p");
      paragraph.textContent = caption;

      const button = document.createElement("button");
      button.type = "button";
      button.className = "caption-copy";
      button.textContent = "Copy Caption";

      button.addEventListener("click", async () => {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(caption);
          } else {
            const textarea = document.createElement("textarea");
            textarea.value = caption;
            textarea.style.position = "fixed";
            textarea.style.left = "-9999px";

            document.body.appendChild(textarea);
            textarea.select();

            const success = document.execCommand("copy");
            textarea.remove();

            if (!success) {
              throw new Error("Copy failed");
            }
          }

          button.textContent = "Copied!";
          button.classList.add("copied");

          setTimeout(() => {
            button.textContent = "Copy Caption";
            button.classList.remove("copied");
          }, 1500);

        } catch (error) {
          button.textContent = "Copy Failed";
        }
      });

      card.appendChild(paragraph);
      card.appendChild(button);
      list.appendChild(card);
    });

    countText.textContent =
      "Showing " + Math.min(visibleCount, results.length) +
      " of " + results.length + " captions";

    loadMore.style.display =
      results.length > visibleCount ? "block" : "none";
  }

  categoryButtons.forEach(button => {
    button.addEventListener("click", () => {
      currentCategory = button.dataset.category;
      visibleCount = 20;

      categoryButtons.forEach(item => {
        item.classList.remove("active");
      });

      button.classList.add("active");
      renderCaptions();
    });
  });

  search.addEventListener("input", () => {
    visibleCount = 20;
    renderCaptions();
  });

  loadMore.addEventListener("click", () => {
    visibleCount += 20;
    renderCaptions();
  });

  renderCaptions();

  console.log("Caption Generator Loaded");
  console.log("Captions per category:", 200);
})();
</script>

</body>
</html>
