  let allBios = [];

  function randomItem(array) {
    return array[Math.floor(Math.random() * array.length)];
  }

  function shuffle(array) {
    const copy = [...array];

    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }

    return copy;
  }

  function createBios(type) {

    const phrases = categories[type];
    const bios = new Set();
    let attempts = 0;

    while (bios.size < 150 && attempts < 50000) {

      const lineCount = 2 + Math.floor(Math.random() * 4);
      const selected = shuffle(phrases).slice(0, lineCount);

      const bio = selected.join("\n");

      bios.add(bio);
      attempts++;
    }

    return shuffle([...bios]);
  }

  function renderBios() {

    resultArea.innerHTML = "";
    message.textContent = "";

    const type = category.value;

    if (!categories[type]) {
      message.textContent = "Please select a valid category.";
      return;
    }

    allBios = createBios(type);

    if (allBios.length === 0) {
      message.textContent = "Please try again.";
      return;

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    message.textContent = "✅ Bio copied successfully!";
    return true;

  } catch (error) {
    const temp = document.createElement("textarea");
    temp.value = text;
    temp.style.position = "fixed";
    temp.style.opacity = "0";

    document.body.appendChild(temp);
    temp.select();

    const copied = document.execCommand("copy");
    temp.remove();

    message.textContent = copied
      ? "✅ Bio copied successfully!"
      : "❌ Copy failed!";

    return copied;
  }
}
